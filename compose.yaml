services:
  photo-library:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
        APP_PORT: 3000
    image: photo-library:${IMAGE_TAG:-latest}
    container_name: photo-library
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8082}:3000"
    environment:
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
